# NetScan configuration — copy to netscan.yaml and adjust.
# NEVER commit tokens/secrets: prefer environment variables
# (NETSCAN_PROXMOX__0__TOKEN_SECRET, NETSCAN_TRUENAS__0__API_KEY, ...).

# 127.0.0.1 keeps the API reachable only from this machine. Only change this
# to 0.0.0.0 (listen on all interfaces) after setting NETSCAN_API_TOKEN —
# without a token, an API bound to 0.0.0.0 is unauthenticated and lets
# anyone on your LAN trigger scans, read the inventory and wake devices.
api_host: 127.0.0.1
api_port: 8600
data_dir: data
# api_token: ""  # set via NETSCAN_API_TOKEN env var, required before api_host: 0.0.0.0

scan:
  network: ""            # empty = auto-detect
  interval_minutes: 60   # 0 disables the periodic scan
  workers: 50
  full: false
  use_mdns: true
  use_fingerprint: true
  use_nmap: true         # nmap -sV para versiones reales (si está instalado)
  use_nmap_os: false     # nmap -O (lento, requiere admin)
  use_rustscan: true     # descubrimiento ultrarrápido de puertos (si está instalado)
  use_nuclei: false      # auditoría de vulnerabilidades de las web UIs (opt-in)
  alert_on_new_device: true
  alert_on_device_down: false
  # --- Speed test / métricas de calidad por dispositivo ---
  use_speedtest: true    # latencia media/min/max, jitter, pérdida y handshake TCP
  speedtest_pings: 5     # nº de pings por dispositivo (jitter/pérdida)
  use_throughput: false  # medir ancho de banda real por HTTP (más lento, opt-in)

# Notification targets (Apprise URLs): ntfy, Telegram, Discord, email...
notify_urls:
  # - "ntfy://ntfy.sh/mi-topic-homelab"
  # - "tgram://BOT_TOKEN/CHAT_ID"

proxmox:
  - name: pve1
    host: 192.168.1.11
    port: 8006
    token_id: "root@pam!netscan"     # Datacenter → Permissions → API Tokens
    token_secret: ""                  # better: NETSCAN_PROXMOX__0__TOKEN_SECRET
    verify_ssl: false
  # - name: pve2
  #   host: 192.168.1.12

truenas:
  - name: nas
    host: 192.168.1.20
    port: 443
    use_ssl: true
    api_key: ""                       # better: NETSCAN_TRUENAS__0__API_KEY
    verify_ssl: false

adguard:
  - name: adguard
    host: 192.168.1.30
    port: 80
    username: ""
    password: ""                      # better: NETSCAN_ADGUARD__0__PASSWORD
