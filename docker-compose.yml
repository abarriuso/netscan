services:
  netscan:
    build:
      context: .
      dockerfile: docker/Dockerfile
    # Host networking so ARP discovery sees your LAN (Linux Docker hosts only).
    network_mode: host
    cap_add:
      - NET_RAW
    environment:
      # 127.0.0.1: the dashboard is only reachable from this machine. To open it
      # to the LAN, set NETSCAN_API_HOST=0.0.0.0 and a NETSCAN_API_TOKEN in .env.
      NETSCAN_API_HOST: ${NETSCAN_API_HOST:-127.0.0.1}
      NETSCAN_API_TOKEN: ${NETSCAN_API_TOKEN:-}
    volumes:
      - ./netscan.yaml:/config/netscan.yaml:ro
      - netscan-data:/data
    restart: unless-stopped

volumes:
  netscan-data:
