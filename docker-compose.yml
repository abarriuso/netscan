services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    network_mode: host          # required for ARP discovery
    cap_add:
      - NET_RAW
    volumes:
      - ./netscan.yaml:/config/netscan.yaml:ro
      - netscan-data:/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "8601:80"
    extra_hosts:
      # Allow the nginx proxy to reach the host-published backend on :8600
      - "host.docker.internal:host-gateway"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  netscan-data:
