name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy
        run: mypy src/netscan

      - name: Pytest
        run: pytest --cov=netscan --cov-report=xml --cov-fail-under=49

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: backend/coverage.xml
          # Codecov now rejects tokenless uploads even for public repos, and
          # there's no CODECOV_TOKEN secret configured — the tests above
          # (including the coverage threshold) already gate correctness;
          # this step is just reporting, so a failed upload shouldn't fail CI.
          fail_ci_if_error: false

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

  license-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install backend + pip-licenses
        run: |
          pip install ./backend pip-licenses

      - name: Verify dependency licenses are GPL-2.0-compatible
        run: |
          # `tail -n +2` drops pip-licenses' own header row ("Name Version
          # License") — without it, the header itself never matches any
          # whitelisted license word and always "fails" the grep -v filter,
          # so this check has been failing unconditionally regardless of
          # actual dependency licenses. GPLv2 (no trailing "+") must match
          # too, not just "GPLv2+": scapy reports plain "GNU General Public
          # License v2 (GPLv2)", which is GPL-2.0-only — compatible with this
          # project's GPL-2.0-or-later (you can always satisfy "or later" by
          # distributing under exactly 2.0), not a real incompatibility.
          if pip-licenses --format=plain --ignore-packages netscan-homelab \
            | tail -n +2 \
            | grep -viE 'MIT|BSD|Apache|LGPL|ISC|PSF|Python|HPND|MPL|GPLv2|GPL-2.0-or-later|Public Domain|Unlicense'; then
            echo "::error::Dependencias con licencia incompatible encontradas (listadas arriba)"
            exit 1
          fi

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install backend (for pip-audit dependency resolution)
        run: pip install -e ./backend

      - name: pip-audit (backend dependencies)
        run: |
          pip install pip-audit
          # --skip-editable so our own editable-installed package (not on
          # PyPI, never will be) doesn't get looked up there — it still
          # audits every real third-party dependency normally. --strict
          # can't be combined with this: it treats a skipped package as a
          # collection failure in its own right, which defeats the point.
          pip-audit --skip-editable

      - name: pnpm audit (frontend dependencies)
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --audit-level=high
