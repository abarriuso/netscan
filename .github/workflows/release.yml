name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  backend-dist:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Build backend distribution
        run: |
          pip install build
          python -m build backend

      - uses: actions/upload-artifact@v4
        with:
          name: netscan-backend-dist
          path: backend/dist/*
          if-no-files-found: error

  windows-installer:
    uses: ./.github/workflows/installer.yml

  linux-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Pre-build the dashboard so users without Node/npm still get a
      # working UI out of the box; install.sh will rebuild it in place
      # when npm is available, mirroring the Windows installer's approach.
      - name: Build dashboard
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Assemble Linux/macOS source bundle
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          stage="netscan-${version}-linux"
          mkdir -p "$stage"
          cp -r backend "$stage/backend"
          rm -rf "$stage/backend/.venv" "$stage/backend"/*.egg-info "$stage/backend/dist"
          find "$stage/backend" -name "__pycache__" -type d -prune -exec rm -rf {} +
          mkdir -p "$stage/frontend"
          cp -r frontend/dist "$stage/frontend/dist"
          cp -r packaging/linux "$stage/packaging_linux"
          cp install.sh netscan.sh README.md CHANGELOG.md LICENSE "$stage/"
          chmod +x "$stage/install.sh" "$stage/netscan.sh"
          tar -czf "netscan-${version}-linux.tar.gz" "$stage"

      - uses: actions/upload-artifact@v4
        with:
          name: netscan-linux-bundle
          path: netscan-*-linux.tar.gz
          if-no-files-found: error

  publish:
    needs: [backend-dist, windows-installer, linux-bundle]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/netscan-backend-dist/*
            dist/NetScan-Setup/NetScan-Setup.exe
            dist/netscan-linux-bundle/*
          generate_release_notes: true
